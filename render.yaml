databases:
  - name: expedientes-db
    plan: free
    databaseName: expedientes
    user: expedientes

services:
  - type: web
    name: expedientes-app
    runtime: python
    plan: free
    rootDir: expedientes_app
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expedientes-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_HOURS
        value: "8"
      - key: DIAS_HABILES_INCOMPLETO
        value: "3"
